<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#087a93" />
  <title>Offline – CalmTinnitus</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f8fb;
      color: #0f172a;
      padding: 1.5rem;
    }
    .card {
      text-align: center;
      max-width: 420px;
      background: #fff;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 16px 40px rgba(15,23,42,.1);
      border: 1px solid #dde6f0;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
    p { color: #475569; line-height: 1.6; margin: 0 0 1.5rem; }
    button {
      padding: .65rem 1.6rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #087a93, #46c0c7);
      color: #fff;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x1F50C;</div>
    <h1>You're offline</h1>
    <p>CalmTinnitus needs an internet connection to load. Please check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
